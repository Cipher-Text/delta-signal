name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest

    env:
      # Prisma resolves env("DATABASE_URL") when it loads the schema. Nothing
      # here connects to a database — generate and validate are static checks —
      # but the variable has to be present and well-formed.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail the build on any high or critical CVE in production dependencies.
      # devDependencies are excluded (--prod) because they never reach production.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      # Must run before any typecheck: apps/api imports types from the
      # generated Prisma client, which does not exist in a fresh install.
      - name: Generate Prisma client
        run: pnpm --filter @delta-signal/database run db:generate

      - name: Validate Prisma schema
        run: pnpm exec prisma validate
        working-directory: packages/database

      - name: Typecheck api
        run: pnpm exec tsc --noEmit
        working-directory: apps/api

      - name: Typecheck web
        run: pnpm exec tsc --noEmit
        working-directory: apps/web

      - name: Typecheck admin
        run: pnpm exec tsc --noEmit
        working-directory: apps/admin

      # Unit tests for auth, RBAC and env validation. Fully mocked — no
      # database or running service required.
      - name: Test api
        run: pnpm exec jest --ci
        working-directory: apps/api

      # nest build for the API plus next build for both frontends. Catches
      # decorator and DI errors that tsc alone does not, since Nest wires
      # modules at runtime. No app fetches at build time, so no service
      # needs to be running.
      - name: Build all apps
        run: pnpm build

  e2e:
    name: E2E tests (API)
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      # Minimum 32-character secret; not a real secret — CI only.
      JWT_SECRET: ci-test-jwt-secret-exactly-32-chars!
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @delta-signal/database run db:generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy
        working-directory: packages/database

      - name: Run E2E tests
        run: pnpm exec jest --config jest.e2e.config.js --runInBand --ci
        working-directory: apps/api

  docker-build:
    name: Docker build (API)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Smoke-test the full multi-stage Dockerfile. Catches missing COPY paths,
      # entrypoint issues, and production-install failures that the JS build
      # step above cannot see. Runs in parallel with verify — no dependency.
      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile -t delta-signal/api:ci .
