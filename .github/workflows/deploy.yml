name: Deploy

# Manual only — triggered from the Actions tab, never automatically after CI.
on:
  workflow_dispatch: {}

# Only one deploy runs at a time; a newer push cancels an in-flight run.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & push images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail the deploy on any high/critical CVE in production dependencies.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high

      # ── Build & push Docker images to Docker Hub ───────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/delta-signal-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/delta-signal-api:latest

      - name: Build & push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/delta-signal-web:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/delta-signal-web:latest

      - name: Build & push admin image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/delta-signal-admin:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/delta-signal-admin:latest

      # Deploy to the VPS is manual: SSH in, `docker compose pull` the tag
      # above, then `docker compose up -d`. This workflow only builds and
      # pushes images — it does not touch the VM.
