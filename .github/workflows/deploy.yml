name: Deploy

# Trigger manually or automatically after CI passes on main.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: production
        type: choice
        options: [production, staging]
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

# Only one deploy runs at a time; a newer push cancels an in-flight run.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    # On workflow_run trigger, only proceed when CI actually passed.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    # Resolves secrets from the chosen GitHub environment (production/staging).
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail the deploy on any high/critical CVE in production dependencies.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high

      # ── Build & push Docker images to Docker Hub ───────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nature-grid-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nature-grid-api:latest

      - name: Build & push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nature-grid-web:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nature-grid-web:latest

      - name: Build & push admin image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nature-grid-admin:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nature-grid-admin:latest

      # ── Copy updated compose file to VPS ──────────────────────────────────
      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          source:   docker-compose.prod.yml
          target:   /opt/nature-grid

      # ── SSH into VPS, write .env, pull images, restart ────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG:              ${{ github.sha }}
          DOCKERHUB_USERNAME:     ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_PASSWORD:      ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET:             ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN:            ${{ secrets.CORS_ORIGIN }}
          APP_URL:                ${{ secrets.APP_URL }}
          SMTP_HOST:              ${{ secrets.SMTP_HOST }}
          SMTP_PORT:              ${{ secrets.SMTP_PORT }}
          SMTP_USER:              ${{ secrets.SMTP_USER }}
          SMTP_PASS:              ${{ secrets.SMTP_PASS }}
          SMTP_FROM:              ${{ secrets.SMTP_FROM }}
          GOOGLE_CLIENT_ID:       ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:   ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL:    ${{ secrets.GOOGLE_CALLBACK_URL }}
          STORAGE_ENDPOINT:       ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_ACCESS_KEY:     ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY:     ${{ secrets.STORAGE_SECRET_KEY }}
          STORAGE_BUCKET:         ${{ secrets.STORAGE_BUCKET }}
          STORAGE_REGION:         ${{ secrets.STORAGE_REGION }}
          STORAGE_USE_PATH_STYLE: ${{ secrets.STORAGE_USE_PATH_STYLE }}
          STORAGE_PUBLIC_URL:     ${{ secrets.STORAGE_PUBLIC_URL }}
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          envs: >-
            IMAGE_TAG,DOCKERHUB_USERNAME,
            POSTGRES_PASSWORD,JWT_SECRET,CORS_ORIGIN,APP_URL,
            SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_FROM,
            GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_CALLBACK_URL,
            STORAGE_ENDPOINT,STORAGE_ACCESS_KEY,STORAGE_SECRET_KEY,
            STORAGE_BUCKET,STORAGE_REGION,STORAGE_USE_PATH_STYLE,STORAGE_PUBLIC_URL
          script: |
            set -e
            mkdir -p /opt/nature-grid
            cd /opt/nature-grid

            # Write production .env — overwritten on every deploy so secrets
            # stay in sync with GitHub environment secrets.
            cat > .env << EOF
            DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
            IMAGE_TAG=${IMAGE_TAG}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            CORS_ORIGIN=${CORS_ORIGIN}
            APP_URL=${APP_URL}
            SMTP_HOST=${SMTP_HOST}
            SMTP_PORT=${SMTP_PORT:-587}
            SMTP_USER=${SMTP_USER}
            SMTP_PASS=${SMTP_PASS}
            SMTP_FROM=${SMTP_FROM}
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
            STORAGE_ENDPOINT=${STORAGE_ENDPOINT}
            STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY}
            STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY}
            STORAGE_BUCKET=${STORAGE_BUCKET}
            STORAGE_REGION=${STORAGE_REGION:-us-east-1}
            STORAGE_USE_PATH_STYLE=${STORAGE_USE_PATH_STYLE:-false}
            STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL}
            EOF
            chmod 600 .env

            # Pull the exact images built from this commit.
            docker pull ${DOCKERHUB_USERNAME}/nature-grid-api:${IMAGE_TAG}
            docker pull ${DOCKERHUB_USERNAME}/nature-grid-web:${IMAGE_TAG}
            docker pull ${DOCKERHUB_USERNAME}/nature-grid-admin:${IMAGE_TAG}

            # Restart app services; postgres/redis restart only if config changed.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Remove image layers from previous deploys to free disk space.
            docker image prune -f
