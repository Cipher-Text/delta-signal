name: Deploy

# Runs automatically once the "CI" workflow completes successfully on main,
# or manually from the Actions tab at any time.
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

# Only one deploy runs at a time; a newer push cancels an in-flight run.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & push images
    runs-on: ubuntu-latest
    # Manual runs always proceed; workflow_run-triggered runs only proceed if
    # CI actually passed (workflow_run fires on every CI conclusion, including failure).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      # workflow_run's own github.sha is deploy.yml's ref on main, not the commit
      # CI just validated — pin everything to the commit CI actually ran against.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail the deploy on any high/critical CVE in production dependencies.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high

      # ── Build & push Docker images to Docker Hub ───────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/delta-signal-api:${{ env.DEPLOY_SHA }}
            ${{ secrets.DOCKERHUB_USERNAME }}/delta-signal-api:latest

      - name: Build & push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/delta-signal-web:${{ env.DEPLOY_SHA }}
            ${{ secrets.DOCKERHUB_USERNAME }}/delta-signal-web:latest

      - name: Build & push admin image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/delta-signal-admin:${{ env.DEPLOY_SHA }}
            ${{ secrets.DOCKERHUB_USERNAME }}/delta-signal-admin:latest

      # Deploy to the VPS is manual: SSH in, `docker compose pull` the tag
      # above, then `docker compose up -d`. This workflow only builds and
      # pushes images — it does not touch the VM.
