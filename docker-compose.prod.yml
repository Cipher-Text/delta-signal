# Production stack — pulls pre-built Docker Hub images.
# Do NOT use for local development; use docker-compose.yml instead.
#
# Required env vars — must already exist in /opt/delta-signal/.env on the VM,
# maintained there directly. deploy.yml does NOT write or manage this file;
# it only exports IMAGE_TAG/DOCKERHUB_USERNAME into the SSH session's shell
# env for this one deploy (docker compose prefers shell env over .env for
# those two keys — everything else below comes from the VM's .env):
#   DOCKERHUB_USERNAME  — Docker Hub account that owns the images
#   IMAGE_TAG           — Git SHA of the build to run (set automatically by CI)
#   POSTGRES_PASSWORD   — database password (no default)
#   JWT_SECRET          — API signing key ≥32 chars (no default)
#   CORS_ORIGIN         — comma-separated allowed origins, e.g. https://deltasignal.org
#   APP_URL             — public web URL, e.g. https://deltasignal.org (used in auth emails)
#
# Optional env vars (graceful degradation when absent):
#   MAIL_PROVIDER (smtp | mailgun | ses — defaults to smtp)
#   SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS / SMTP_FROM
#   MAILGUN_API_KEY / MAILGUN_DOMAIN / MAILGUN_FROM / MAILGUN_BASE_URL
#   SES_ACCESS_KEY / SES_SECRET_KEY / SES_REGION / SES_FROM
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_CALLBACK_URL
#   STORAGE_ENDPOINT / STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY
#   STORAGE_BUCKET / STORAGE_REGION / STORAGE_USE_PATH_STYLE / STORAGE_PUBLIC_URL
#   BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PASSWORD  ← first deploy only, then remove
#   NEXT_PUBLIC_SITE_URL / NEXT_PUBLIC_GA_MEASUREMENT_ID / GOOGLE_SITE_VERIFICATION
#   NEXT_PUBLIC_CLARITY_PROJECT_ID
#
# Usage:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-delta_signal}
      POSTGRES_USER:     ${POSTGRES_USER:-delta_signal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delta_signal} -d ${POSTGRES_DB:-delta_signal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    # Not exposed to host in production — only reachable by other services.
    # Uncomment for emergency direct access:
    # ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Not exposed to host — only reachable by the API container.

  api:
    image: ${DOCKERHUB_USERNAME}/delta-signal-api:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-delta_signal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-delta_signal}?schema=public
      REDIS_URL:    redis://redis:6379
      JWT_SECRET:   ${JWT_SECRET}
      PORT:         3001
      NODE_ENV:     production
      CORS_ORIGIN:  ${CORS_ORIGIN}
      APP_URL:      ${APP_URL}
      # ── Mail (optional — provider picked by MAIL_PROVIDER, defaults to smtp;
      #    email silently disabled if the active provider's own vars are unset) ─
      MAIL_PROVIDER:    ${MAIL_PROVIDER:-smtp}
      SMTP_HOST:        ${SMTP_HOST:-}
      SMTP_PORT:        ${SMTP_PORT:-587}
      SMTP_USER:        ${SMTP_USER:-}
      SMTP_PASS:        ${SMTP_PASS:-}
      SMTP_FROM:        ${SMTP_FROM:-}
      MAILGUN_API_KEY:  ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN:   ${MAILGUN_DOMAIN:-}
      MAILGUN_FROM:     ${MAILGUN_FROM:-}
      MAILGUN_BASE_URL: ${MAILGUN_BASE_URL:-}
      SES_ACCESS_KEY:   ${SES_ACCESS_KEY:-}
      SES_SECRET_KEY:   ${SES_SECRET_KEY:-}
      SES_REGION:       ${SES_REGION:-us-east-1}
      SES_FROM:         ${SES_FROM:-}
      # ── Google OAuth (optional — /auth/google returns 404 when unset) ─────
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL:  ${GOOGLE_CALLBACK_URL:-}
      # ── Object storage (optional — /media endpoints return 503 when unset) ─
      STORAGE_ENDPOINT:       ${STORAGE_ENDPOINT:-}
      STORAGE_ACCESS_KEY:     ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY:     ${STORAGE_SECRET_KEY:-}
      STORAGE_BUCKET:         ${STORAGE_BUCKET:-}
      STORAGE_REGION:         ${STORAGE_REGION:-us-east-1}
      STORAGE_USE_PATH_STYLE: ${STORAGE_USE_PATH_STYLE:-false}
      STORAGE_PUBLIC_URL:     ${STORAGE_PUBLIC_URL:-}
      # ── One-time admin bootstrap (remove after first successful deploy) ────
      BOOTSTRAP_ADMIN_EMAIL:    ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  web:
    image: ${DOCKERHUB_USERNAME}/delta-signal-web:${IMAGE_TAG:-latest}
    environment:
      API_URL:  ${API_URL:-http://api:3001}
      PORT:     3000
      HOSTNAME: 0.0.0.0
      # ── Analytics & Search Console (optional) ──────────────────────────────
      NEXT_PUBLIC_SITE_URL:          ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      GOOGLE_SITE_VERIFICATION:      ${GOOGLE_SITE_VERIFICATION:-}
      NEXT_PUBLIC_CLARITY_PROJECT_ID: ${NEXT_PUBLIC_CLARITY_PROJECT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin:
    image: ${DOCKERHUB_USERNAME}/delta-signal-admin:${IMAGE_TAG:-latest}
    environment:
      API_URL:  ${API_URL:-http://api:3001}
      PORT:     3002
      HOSTNAME: 0.0.0.0
    ports:
      - "3002:3002"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
