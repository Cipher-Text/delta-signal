services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI — http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "${DOCKER_DATABASE_URL}"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET}"
      PORT: "3001"
      CORS_ORIGIN: "${CORS_ORIGIN}"
      NODE_ENV: "${NODE_ENV:-production}"
      # ── Production admin bootstrap (one-time) ──────────────────────────────
      # Set these on first deploy only. Once the admin account is created,
      # remove both vars from your deployment environment.
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      # ── Mail ───────────────────────────────────────────────────────────────
      # MAIL_PROVIDER picks the active transport (smtp | mailgun | ses).
      # In Docker, SMTP defaults to the mailpit service by name — override
      # SMTP_HOST/PORT for an external SMTP provider.
      MAIL_PROVIDER: "${MAIL_PROVIDER:-smtp}"
      SMTP_HOST: "${SMTP_HOST:-mailpit}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-Delta Signal <alerts@deltasignal.org>}"
      MAILGUN_API_KEY: "${MAILGUN_API_KEY:-}"
      MAILGUN_DOMAIN: "${MAILGUN_DOMAIN:-}"
      MAILGUN_FROM: "${MAILGUN_FROM:-}"
      MAILGUN_BASE_URL: "${MAILGUN_BASE_URL:-}"
      SES_ACCESS_KEY: "${SES_ACCESS_KEY:-}"
      SES_SECRET_KEY: "${SES_SECRET_KEY:-}"
      SES_REGION: "${SES_REGION:-us-east-1}"
      SES_FROM: "${SES_FROM:-}"
      # ── Google OAuth (optional — /auth/google returns 404 when unset) ──────
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_CALLBACK_URL: "${GOOGLE_CALLBACK_URL:-}"
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_URL: "http://api:3001"
      NEXT_PUBLIC_ENABLE_SEED_LOGIN: "false"
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    ports:
      - "3002:3002"
    environment:
      API_URL: "http://api:3001"
      NEXT_PUBLIC_ENABLE_SEED_LOGIN: "false"
    depends_on:
      api:
        condition: service_healthy
