services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "${DOCKER_DATABASE_URL}"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET}"
      PORT: "3001"
      CORS_ORIGIN: "${CORS_ORIGIN}"
      APP_URL: "${APP_URL}"
      NODE_ENV: "${NODE_ENV:-production}"
      # ── Production admin bootstrap (one-time) ──────────────────────────────
      # Set these on first deploy only. Once the admin account is created,
      # remove both vars from your deployment environment.
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      # ── Mail ───────────────────────────────────────────────────────────────
      # MAIL_PROVIDER picks the active transport (smtp | mailgun | ses).
      # SMTP transport is a no-op until SMTP_HOST is set to a real server.
      MAIL_PROVIDER: "${MAIL_PROVIDER:-smtp}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-Delta Signal <alerts@deltasignal.org>}"
      MAILGUN_API_KEY: "${MAILGUN_API_KEY:-}"
      MAILGUN_DOMAIN: "${MAILGUN_DOMAIN:-}"
      MAILGUN_FROM: "${MAILGUN_FROM:-}"
      MAILGUN_BASE_URL: "${MAILGUN_BASE_URL:-}"
      SES_ACCESS_KEY: "${SES_ACCESS_KEY:-}"
      SES_SECRET_KEY: "${SES_SECRET_KEY:-}"
      SES_REGION: "${SES_REGION:-us-east-1}"
      SES_FROM: "${SES_FROM:-}"
      # ── Google OAuth (optional — /auth/google returns 404 when unset) ──────
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_CALLBACK_URL: "${GOOGLE_CALLBACK_URL:-}"
      # ── Object storage ────────────────────────────────────────────────────
      STORAGE_ENDPOINT: "${STORAGE_ENDPOINT:-}"
      STORAGE_ACCESS_KEY: "${STORAGE_ACCESS_KEY:-}"
      STORAGE_SECRET_KEY: "${STORAGE_SECRET_KEY:-}"
      STORAGE_BUCKET: "${STORAGE_BUCKET:-}"
      STORAGE_REGION: "${STORAGE_REGION:-us-east-1}"
      STORAGE_USE_PATH_STYLE: "${STORAGE_USE_PATH_STYLE:-false}"
      STORAGE_PUBLIC_URL: "${STORAGE_PUBLIC_URL:-}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_URL: "http://api:3001"
      NEXT_PUBLIC_ENABLE_SEED_LOGIN: "false"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}"
      NEXT_PUBLIC_GA_MEASUREMENT_ID: "${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}"
      NEXT_PUBLIC_CLARITY_PROJECT_ID: "${NEXT_PUBLIC_CLARITY_PROJECT_ID:-}"
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    ports:
      - "3002:3002"
    environment:
      API_URL: "http://api:3001"
      NEXT_PUBLIC_ENABLE_SEED_LOGIN: "false"
    depends_on:
      api:
        condition: service_healthy
